<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Bản Đồ Ứng Viên Việt Nam</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f0f2f5;
    }

    h2 {
      margin: 0 0 10px 0;
      text-align: center;
      color: #1a3c6e;
    }

    .container {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .left-panel {
      flex: 0 0 480px;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }

    .right-panel {
      flex: 1;
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: auto;
    }

    .company-input-group {
      margin-bottom: 12px;
    }

    .company-input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      color: #1a3c6e;
      font-size: 13px;
    }

    .company-input-group input {
      width: 100%;
      padding: 7px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .toolbar button {
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: #fff;
      font-size: 12px;
    }

    #btnImportExcel {
      background: #217346;
    }

    #btnImportExcel:hover {
      background: #1a5c38;
    }

    #btnUpdate {
      background: #1a73e8;
    }

    #btnUpdate:hover {
      background: #1558b0;
    }

    #btnPrint {
      background: #7c3aed;
    }

    #btnPrint:hover {
      background: #6d28d9;
    }

    #btnCopyImage {
      background: #f59e0b;
    }

    #btnCopyImage:hover {
      background: #d97706;
    }

    #btnDownloadPng {
      background: #475569;
    }

    #btnDownloadPng:hover {
      background: #334155;
    }

    #btnExportExcel {
      background: #ea580c;
    }

    #btnExportExcel:hover {
      background: #c2410c;
    }

    #btnExportWord {
      background: #0891b2;
    }

    #btnExportWord:hover {
      background: #0e7490;
    }

    #btnResetLayout {
      grid-column: 1 / span 2;
      background: #b91c1c;
    }

    #btnResetLayout:hover {
      background: #991b1b;
    }

    table#dataTable {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table#dataTable th,
    table#dataTable td {
      border: 1px solid #ddd;
      padding: 4px 6px;
      text-align: left;
    }

    table#dataTable th {
      background: #1a3c6e;
      color: #fff;
      position: sticky;
      top: 0;
    }

    table#dataTable td input {
      width: 100%;
      border: 1px solid #ccc;
      padding: 3px 4px;
      font-size: 12px;
      box-sizing: border-box;
      white-space: nowrap;
    }

    table#dataTable td input.input-error {
      border: 1px solid #dc2626;
      background: #fef2f2;
      outline: none;
    }

    .province-warning {
      display: none;
      color: #dc2626;
      font-size: 11px;
      margin-top: 2px;
      font-weight: bold;
    }

    .province-warning.show {
      display: block;
    }

    .table-wrap {
      max-height: 70vh;
      overflow-y: auto;
      border: 1px solid #ddd;
    }

    .btn-del {
      background: #e53935;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 3px 8px;
    }

    .btn-add-row {
      margin-top: 8px;
      width: 100%;
      padding: 6px;
      border: none;
      border-radius: 6px;
      background: #555;
      color: #fff;
      cursor: pointer;
    }

    .map-stage {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    #mapImage {
      display: block;
      width: 100%;
      height: auto;
    }

    #mapCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      cursor: default;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 8px;
      padding: 16px;
      width: 480px;
      max-width: 90vw;
    }

    .modal-box h3 {
      margin-top: 0;
    }

    .modal-box textarea {
      width: 100%;
      height: 160px;
      font-family: Consolas, monospace;
      font-size: 12px;
      padding: 6px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
    }

    #btnPasteConfirm {
      background: #1a73e8;
    }

    #btnPasteCancel {
      background: #888;
    }

    @media print {
      body {
        background: white;
        margin: 0;
        padding: 0;
      }

      h2 {
        display: none !important;
      }

      .left-panel {
        display: none !important;
      }

      .container {
        display: block;
      }

      .right-panel {
        box-shadow: none;
        padding: 0;
        margin: 0;
        width: 100%;
        max-width: 100%;
      }

      .map-stage {
        max-width: 100%;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>

  <h2>BẢN ĐỒ ỨNG VIÊN - VIỆT NAM 63 TỈNH THÀNH</h2>

  <div class="container">
    <div class="left-panel">
      <div class="company-input-group">
        <label for="companyNameInput">Tên xí nghiệp / Công ty tiếp nhận</label>
        <input type="text" id="companyNameInput" placeholder="久野金属株式会社 様">
      </div>

      <div class="toolbar">
        <button id="btnImportExcel">📥 Nhập Excel</button>
        <button id="btnUpdate">🔄 Cập nhật</button>

        <button id="btnCopyImage">📋 Sao chép ảnh (Copy)</button>
        <button id="btnDownloadPng">⬇️ Tải ảnh PNG</button>
        <button id="btnExportExcel">📊 Xuất Excel</button>
        <button id="btnExportWord">📄 Xuất Word</button>
        <button id="btnResetLayout"
          title="Xóa toàn bộ vị trí đã kéo tay và tính lại vị trí mặc định cho mọi ứng viên">♻️ Đặt lại vị trí mặc
          định</button>

          <tbody id="dataTableBody"></tbody>
        </table>

    function normalizeStr(str) {
      return (str || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/đ/gi, "d")
        .toUpperCase()
        .trim()
        .replace(/\s+/g, " ");
    }

    /* ======================================================
       BỘ TỪ ĐIỂN BÍ DANH / TÊN THÀNH PHỐ PHỔ BIẾN
       Khi người dùng nhập tên thành phố quen thuộc thay vì tên
       tỉnh chính thức (ví dụ "nha trang" thay vì "khanh hoa"),
       hệ thống tự động quy đổi về tỉnh chính thức tương ứng,
       không còn bị âm thầm bỏ qua ứng viên trên bản đồ.
       Key/value đều đã qua normalizeStr (không dấu, chữ hoa).
       ====================================================== */
    const PROVINCE_ALIASES = {
      "NHA TRANG": "KHANH HOA",
      "SAI GON": "HO CHI MINH",
      "SAIGON": "HO CHI MINH",
      "VUNG TAU": "BA RIA VUNG TAU",
      "DA LAT": "LAM DONG",
      "BUON MA THUOT": "DAK LAK",
      "BMT": "DAK LAK",
      "PHAN THIET": "BINH THUAN",
      "QUY NHON": "BINH DINH"
    };

    // Quy đổi tên tỉnh/thành do người dùng nhập về key chuẩn trong
    // PROVINCE_COORDINATES: trước tiên tra bí danh (alias), nếu không
    // khớp bí danh nào thì dùng chính key đã chuẩn hoá (đã có thể là
    // tên tỉnh chính thức như "HA NOI", "KHANH HOA",...).
    function resolveProvinceKey(inputName) {
      const key = normalizeStr(inputName);
      return PROVINCE_ALIASES[key] || key;
    }

    function findProvince(inputName) {
      const key = resolveProvinceKey(inputName);
      return PROVINCE_COORDINATES[key] || null;
    }

    function getJapaneseSuffix(provinceName) {
      const key = resolveProvinceKey(provinceName);
      if (key === "HA NOI" || key === "HANOI") return "首都";
      if (key === "HO CHI MINH" || key === "TP HCM" || key === "HCM") return "市";
      return "省";
    }

       Miền Bắc & Miền Trung ưu tiên dạt sang cột PHẢI (khoảng
       trống biển Đông / đảo Hải Nam). Miền Nam ưu tiên dạt
       sang cột TRÁI (khoảng trống phía Lào / vịnh Thái Lan).
       ====================================================== */
    const NORTH_PROVINCES = ["HA NOI", "HANOI", "HA GIANG", "CAO BANG", "BAC KAN", "TUYEN QUANG",
      "LAO CAI", "YEN BAI", "THAI NGUYEN", "LANG SON", "BAC GIANG", "PHU THO", "VINH PHUC",

    function getPreferredSide(provinceName) {
      const key = resolveProvinceKey(provinceName);
      if (NORTH_PROVINCES.includes(key) || CENTRAL_PROVINCES.includes(key)) return "right";
      return "left";

    function updateProvinceValidation(inputEl, provinceValue) {

    /* ======================================================
       XUẤT ẢNH BẢN ĐỒ RA WORD/EXCEL - KHÔNG BỊ LỖI DẤU X ĐỎ
       Nguyên nhân lỗi cũ: thẻ <img src="data:image/png;base64,...">
       bị Word/Excel chặn vì không phải định dạng MHTML chuẩn.
       Giải pháp: đóng gói toàn bộ file theo chuẩn MHTML
       (multipart/related, ảnh base64 nhúng qua Content-ID "cid:"),
       đây là định dạng gốc mà Word/Excel luôn đọc được.
       ====================================================== */
    function wrapBase64(base64) {
      const lineLen = 76;
      const lines = [];
      for (let i = 0; i < base64.length; i += lineLen) {
        lines.push(base64.substring(i, i + lineLen));
      }
      return lines.join("\r\n");
    }

    function getCanvasBase64Png() {
      return canvas.toDataURL("image/png").split(",")[1];
    }

    function buildWordMhtml() {
      const boundary = "----boundary-word-doc";
      const base64Lines = wrapBase64(getCanvasBase64Png());
      return [
        "MIME-Version: 1.0",
        `Content-Type: multipart/related; boundary="${boundary}"`,
        "",
        `--${boundary}`,
        'Content-Type: text/html; charset="utf-8"',
        "Content-Location: file:///document.html",
        "",
        '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">',
        "<head>",
        '<meta charset="UTF-8">',
        "<title>Bản đồ ứng viên Việt Nam</title>",
        "<style>",
        "  body { font-family: Arial, sans-serif; margin: 30px; }",
        "  h1 { text-align: center; color: #1a3c6e; page-break-after: avoid; }",
        "  .map-container { text-align: center; margin: 20px 0; }",
        "  .map-container img { width: 100%; max-width: 800px; height: auto; }",
        "</style>",
        "</head>",
        "<body>",
        "<h1>BẢN ĐỒ ỨNG VIÊN VIỆT NAM</h1>",
        '<div class="map-container">',
        '<img src="cid:map_image.png" alt="Bản đồ ứng viên">',
        "</div>",
        "</body>",
        "</html>",
        "",
        `--${boundary}`,
        'Content-Type: image/png;name="map_image.png"',
        "Content-Transfer-Encoding: base64",
        "Content-Location: file:///map_image.png",
        "Content-ID: <map_image.png>",
        "",
        base64Lines,
        "",
        `--${boundary}--`
      ].join("\r\n");
    }

    function buildExcelMhtml() {
      const boundary = "----boundary-excel-doc";
      const base64Lines = wrapBase64(getCanvasBase64Png());

    /* ======================================================
       HỆ TỌA ĐỘ VẼ CỐ ĐỊNH (tương đương viewBox của SVG)
       Kích thước thực tế của file BanDoVN.png: 1851 x 2409 px.
       Canvas luôn được set width/height = đúng kích thước gốc này,
       sau đó CSS co giãn (width:100%; height:auto) để khớp khung hiển thị.
       => rx/ry (0.0-1.0) luôn quy đổi ra đúng pixel gốc của ảnh,
          mũi tên ghim chính xác tuyệt đối dù màn hình to/nhỏ khác nhau.
       ====================================================== */
    const IMG_WIDTH = 1851;
    const IMG_HEIGHT = 2409;

    const BOX_HEIGHT = 80;
    const BOX_GAP = 45;
    const BOX_PADDING_X = 14;
    const MARGIN_X = 24;
    const FONT_SIZE = 24;
    const TOP_RESERVED = 70;
    const COMPANY_FONT_SIZE = 36;
    const SPECIAL_BOX_HEIGHT = 56;
    const DRAG_HANDLE_RADIUS = 26;
    const MIN_BOX_WIDTH = 60;
    const RESIZE_HANDLE_WIDTH = 8;
    const MAX_RIGHT_COLUMN_ITEMS = 6;
    const OVERLAP_GAP = 8;

    function resizeCanvas() {
      canvas.width = IMG_WIDTH;
      canvas.height = IMG_HEIGHT;
      canvas.style.width = "100%";
      canvas.style.height = "auto";
    }

    // Giới hạn 1 giá trị trong khoảng [min, max] - dùng cho mọi phép
    // "boundary clamp" để ô/mục tiêu không bao giờ văng ra ngoài canvas.
    function clamp(value, min, max) {
      if (max < min) return max;
      return Math.min(Math.max(value, min), max);
    }

    function getBoxColor(provinceDisplayName) {
      const key = resolveProvinceKey(provinceDisplayName);
      if (key === "HA NOI" || key === "HANOI") return "#1E40AF";
      if (key === "HO CHI MINH" || key === "TP HCM" || key === "HCM") return "#DC2626";
      return "#16A34A";
    }

    function drawArrow(fromX, fromY, toX, toY, color) {
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3.5;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      const angle = Math.atan2(toY - fromY, toX - fromX);
      const headLen = 20;
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(
        toX - headLen * Math.cos(angle - Math.PI / 6),
        toY - headLen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        toX - headLen * Math.cos(angle + Math.PI / 6),
        toY - headLen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
    }

    /* Vẽ 1 ô nhãn (hộp màu + chữ trắng + mũi tên trỏ vào target).
       Điểm xuất phát của mũi tên tự chọn cạnh trái/phải của ô
       tùy theo target nằm bên nào so với tâm ô - luôn đúng dù ô
       đã bị kéo thả đến vị trí tuỳ ý. Nội dung chữ được clip theo
       chiều rộng ô để không tràn ra ngoài khi ô nhỏ hơn độ dài chữ.
       Ô được giữ phẳng, không vẽ chốt/vạch trang trí nào ở mép -
       vùng tay cầm kéo giãn chiều rộng ở mép phải hoàn toàn trong
       suốt (không vẽ gì), chỉ bắt sự kiện chuột ngầm. */
    function renderCalloutBox(opts) {
      const { boxX, boxY, boxWidth, boxHeight, text, color, targetX, targetY, strokeColor } = opts;
      const boxCenterY = boxY + boxHeight / 2;

      ctx.fillStyle = color;
      ctx.strokeStyle = strokeColor || "#333";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 10);
      } else {
        ctx.rect(boxX, boxY, boxWidth, boxHeight);
      }
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.beginPath();
      ctx.rect(boxX + 2, boxY, boxWidth - 4, boxHeight);
      ctx.clip();
      ctx.fillStyle = "#FFFFFF";
      ctx.textAlign = "left";
      ctx.fillText(text, boxX + BOX_PADDING_X, boxCenterY);
      ctx.restore();

      const boxCenterX = boxX + boxWidth / 2;
      const arrowStartX = targetX < boxCenterX ? boxX : boxX + boxWidth;
      drawArrow(arrowStartX, boxCenterY, targetX, targetY, color);
    }

    /* ======================================================
       THUẬT TOÁN TỰ ĐỘNG XẾP VỊ TRÍ Ô - KHÔNG ĐÈ NHAU, KHÔNG
       CHE BẢN ĐỒ:
       - Mọi ô auto-layout luôn nằm sát rìa trái (x = MARGIN_X)
         hoặc rìa phải (x = width - MARGIN_X - boxWidth) của
         canvas, tuyệt đối không nằm giữa vùng hình bản đồ.
       - Ô thuộc Miền Bắc/Miền Trung được ưu tiên xếp cột PHẢI.
         Ô thuộc Miền Nam được ưu tiên xếp cột TRÁI.
       - Khi cột phải vượt quá MAX_RIGHT_COLUMN_ITEMS ô, các ô
         dư (xa mục tiêu nhất tính theo thứ tự từ trên xuống)
         tự động tràn qua cột trái.
       - Trong cùng 1 cột, các ô cách nhau tối thiểu BOX_GAP
         (45px) theo trục dọc để không dính đè, giữ mũi tên
         thoáng, không rối.
       ====================================================== */
    function layoutColumn(items) {
      items.sort((a, b) => a.targetY - b.targetY);
      const n = items.length;
      if (n === 0) return items;

      const positions = new Array(n);
      positions[0] = Math.max(items[0].targetY - BOX_HEIGHT / 2, TOP_RESERVED);

      for (let i = 1; i < n; i++) {
        const idealY = items[i].targetY - BOX_HEIGHT / 2;
        const minY = positions[i - 1] + BOX_HEIGHT + BOX_GAP;
        positions[i] = Math.max(idealY, minY);
      }

      const maxY = canvas.height - BOX_HEIGHT - 5;
      if (positions[n - 1] > maxY) {
        positions[n - 1] = maxY;
        for (let i = n - 2; i >= 0; i--) {
          const limit = positions[i + 1] - BOX_HEIGHT - BOX_GAP;
          if (positions[i] > limit) positions[i] = limit;
        }
      }

      items.forEach((item, i) => { item.boxY = Math.max(TOP_RESERVED, positions[i]); });
      return items;
    }

    // Gom nhóm theo cột ưu tiên, tràn ô dư từ phải sang trái khi quá dày
    function assignColumns(items) {
      const rightPreferred = [];
      const leftPreferred = [];
      items.forEach(item => {
        if (item.preferredSide === "right") rightPreferred.push(item);
        else leftPreferred.push(item);
      });

      rightPreferred.sort((a, b) => a.targetY - b.targetY);

      let rightItems = rightPreferred;
      let overflow = [];
      if (rightPreferred.length > MAX_RIGHT_COLUMN_ITEMS) {
        rightItems = rightPreferred.slice(0, MAX_RIGHT_COLUMN_ITEMS);
        overflow = rightPreferred.slice(MAX_RIGHT_COLUMN_ITEMS);
      }

      return { leftItems: leftPreferred.concat(overflow), rightItems };
    }

    /* ======================================================
       CHỐNG ĐÈ (ANTI-OVERLAP): nếu 2 ô bất kỳ (ứng viên hoặc
       nhãn đặc biệt) có vùng hình chữ nhật giao nhau - thường
       do 2 ứng viên cùng trỏ vào 1 tỉnh hoặc bị trùng toạ độ
       sau khi kéo tay - tự động đẩy ô bị đè xuống dưới ô kia
       1 khoảng OVERLAP_GAP để không còn che khuất nhau. Chạy
       nhiều lượt (pass) để xử lý cả trường hợp dây chuyền (đẩy
       ô này lại chạm phải ô khác), sau đó chốt lại biên dưới
       của canvas để không bị đẩy văng ra ngoài khung nhìn.
       ====================================================== */
    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function resolveOverlaps(items) {
      for (let pass = 0; pass < 6; pass++) {
        let moved = false;
        for (let i = 0; i < items.length; i++) {
          for (let j = 0; j < items.length; j++) {
            if (i === j) continue;
            const a = items[i];
            const b = items[j];
            const boxA = { x: a.boxX, y: a.boxY, w: a.boxWidth, h: a.boxHeight };
            const boxB = { x: b.boxX, y: b.boxY, w: b.boxWidth, h: b.boxHeight };
            if (rectsOverlap(boxA, boxB)) {
              const pushTo = boxA.y + boxA.h + OVERLAP_GAP;
              if (b.boxY < pushTo) {
                b.boxY = pushTo;
                moved = true;
              }
            }
          }
        }
        if (!moved) break;
      }
      // Sau khi đẩy so-le, đảm bảo vẫn nằm trong khung nhìn canvas (boundary clamp)
      items.forEach(item => {
        item.boxY = clamp(item.boxY, TOP_RESERVED, canvas.height - 5 - item.boxHeight);
      });
    }

    /* ======================================================
       2 NHÃN ĐẶC BIỆT CỐ ĐỊNH: HÀ NỘI (thủ đô) & TP.HCM
       Độc lập hoàn toàn với danh sách ứng viên, luôn hiển thị
       trên bản đồ, nền đỏ - chữ trắng in hoa đậm. Vị trí mặc định
       nằm sát lề phải nhưng ở ngang hàng với vị trí thực tế của
       Hà Nội / TP.HCM trên bản đồ (tương tự cách các ô ứng viên
       như Phú Thọ, Hải Phòng được xếp gần khu vực mục tiêu),
       KHÔNG còn bị văng ra góc trên/góc dưới của bảng. Có thể kéo
       thả tự do (ô và đầu mũi tên) - vị trí sau khi chỉnh được
       lưu lại trong chính object nhãn.
       ====================================================== */
    const hanoiLabel = { boxOverride: false, targetOverride: false, boxWidthOverride: null, boxX: 0, boxY: 0, targetX: 0, targetY: 0, _box: null, _target: null };
    const hcmLabel = { boxOverride: false, targetOverride: false, boxWidthOverride: null, boxX: 0, boxY: 0, targetX: 0, targetY: 0, _box: null, _target: null };

    // Chỉ TÍNH TOÁN vị trí/kích thước của nhãn đặc biệt (không vẽ ngay),
    // để có thể chạy resolveOverlaps() chống đè với các ô ứng viên khác
    // trước khi thực sự vẽ lên canvas.
    function computeSpecialLabelLayout(ref, text, defaultTargetX, defaultTargetY, defaultBoxX, defaultBoxY) {
      ctx.font = `bold ${FONT_SIZE}px Arial`;
      const autoWidth = ctx.measureText(text).width + BOX_PADDING_X * 2;
      // Chiều rộng tối thiểu luôn phải đủ ôm trọn văn bản (autoWidth) để không
      // bao giờ bị cắt chữ, ngay cả khi người dùng đã kéo giãn thu nhỏ trước đó.
      const boxWidth = Math.max(MIN_BOX_WIDTH, autoWidth, ref.boxWidthOverride || 0);
      const boxHeight = SPECIAL_BOX_HEIGHT;

      const targetX = ref.targetOverride ? ref.targetX : defaultTargetX;
      const targetY = ref.targetOverride ? ref.targetY : defaultTargetY;

      let boxX = ref.boxOverride ? ref.boxX : defaultBoxX(boxWidth);
      let boxY = ref.boxOverride ? ref.boxY : defaultBoxY(boxHeight);

      // Boundary clamp: ô không bao giờ được văng ra ngoài khung nhìn canvas.
      boxX = clamp(boxX, MARGIN_X, canvas.width - MARGIN_X - boxWidth);
      boxY = clamp(boxY, TOP_RESERVED, canvas.height - 5 - boxHeight);

      return {
        ref, isSpecial: true, text, color: "#DC2626", strokeColor: "#7f1d1d",
        boxX, boxY, boxWidth, boxHeight, targetX, targetY
      };
    }

    function renderCompanyLabel() {
      ctx.font = `bold ${COMPANY_FONT_SIZE}px Arial`;
      const text = `企業名 : ${companyLabel.text || ""}`;
      const textWidth = ctx.measureText(text).width;
      const boxHeight = COMPANY_FONT_SIZE * 1.2;

      let x = companyLabel.override ? companyLabel.x : MARGIN_X;
      let y = companyLabel.override ? companyLabel.y : 10;

      // Boundary clamp: nhãn tên công ty cũng không bao giờ văng ra ngoài canvas.
      x = clamp(x, 0, Math.max(0, canvas.width - textWidth - 10));
      y = clamp(y, 0, canvas.height - boxHeight);

      ctx.textBaseline = "top";
      ctx.textAlign = "left";
      ctx.fillStyle = "#000000";
      ctx.fillText(text, x, y);
      ctx.textBaseline = "middle";

      companyLabel._box = { x, y, w: textWidth, h: boxHeight };
    }

    function drawCallouts() {
      resizeCanvas();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(mapImage, 0, 0, canvas.width, canvas.height);
      ctx.textBaseline = "middle";

      // Dòng chữ tên xí nghiệp / công ty tiếp nhận - góc trên cùng bên trái (kéo thả được)
      renderCompanyLabel();

      ctx.font = `bold ${FONT_SIZE}px Arial`;

      const autoItems = [];
      const fixedItems = [];

      candidates.forEach((c, idx) => {
        c._box = null;
        c._target = null;
        if (!c.name || !c.province) return;
        const prov = findProvince(c.province);
        if (!prov) return;

        const stt = idx + 1;
        const suffix = getJapaneseSuffix(c.province);
        const text = `${stt}. ${normalizeStr(c.name)} -> ${normalizeStr(c.province)} ${suffix}`;
        const color = getBoxColor(c.province);

        const targetX = c.targetOverride ? c.targetX : prov.rx * canvas.width;
        const targetY = c.targetOverride ? c.targetY : prov.ry * canvas.height;

        const autoWidth = ctx.measureText(text).width + BOX_PADDING_X * 2;
        // Chiều rộng tối thiểu luôn phải đủ ôm trọn văn bản (autoWidth) để không
        // bao giờ bị cắt chữ, ngay cả khi người dùng đã kéo giãn thu nhỏ trước đó.
        const boxWidth = Math.max(MIN_BOX_WIDTH, autoWidth, c.boxWidthOverride || 0);

        const item = { c, isSpecial: false, text, color, targetX, targetY, boxWidth, boxHeight: BOX_HEIGHT, preferredSide: getPreferredSide(c.province) };

        if (c.boxOverride) {
          // Boundary clamp: ô đã bị kéo tay cũng không bao giờ được văng ra ngoài canvas.
          item.boxX = clamp(c.boxX, MARGIN_X, canvas.width - MARGIN_X - boxWidth);
          item.boxY = clamp(c.boxY, TOP_RESERVED, canvas.height - 5 - BOX_HEIGHT);
          fixedItems.push(item);
        } else {
          autoItems.push(item);
        }
      });

      const { leftItems, rightItems } = assignColumns(autoItems);

      layoutColumn(leftItems);
      layoutColumn(rightItems);
      leftItems.forEach(item => { item.boxX = MARGIN_X; });
      rightItems.forEach(item => { item.boxX = canvas.width - MARGIN_X - item.boxWidth; });

      // Nhãn đặc biệt cố định: Hà Nội (thủ đô) & TP.HCM - chỉ TÍNH TOÁN vị trí
      // ở đây, việc vẽ thực tế được gộp chung vào vòng lặp render bên dưới
      // để có thể chống đè (resolveOverlaps) với toàn bộ ô ứng viên khác.
      const hanoiCoord = PROVINCE_COORDINATES["HA NOI"];
      const hanoiItem = computeSpecialLabelLayout(
        hanoiLabel, "HA NOI 首都",
        hanoiCoord.rx * canvas.width, hanoiCoord.ry * canvas.height,
        (w) => canvas.width - MARGIN_X - w,
        (h) => hanoiCoord.ry * canvas.height - h / 2
      );

      const hcmCoord = PROVINCE_COORDINATES["HO CHI MINH"];
      const hcmItem = computeSpecialLabelLayout(
        hcmLabel, "HO CHI MINH 市",
        hcmCoord.rx * canvas.width, hcmCoord.ry * canvas.height,
        (w) => canvas.width - MARGIN_X - w,
        (h) => hcmCoord.ry * canvas.height - h / 2
      );

      // Chống đè hoàn toàn: gộp TẤT CẢ ô (ứng viên + 2 nhãn đặc biệt) vào
      // 1 danh sách duy nhất rồi chạy resolveOverlaps() trước khi vẽ,
      // đảm bảo không còn cặp ô nào bị chồng lấn lên nhau trên bản đồ.
      const allBoxItems = [...leftItems, ...rightItems, ...fixedItems, hanoiItem, hcmItem];
      resolveOverlaps(allBoxItems);

      allBoxItems.forEach(item => {
        renderCalloutBox({
          boxX: item.boxX, boxY: item.boxY, boxWidth: item.boxWidth, boxHeight: item.boxHeight,
          text: item.text, color: item.color, strokeColor: item.strokeColor,
          targetX: item.targetX, targetY: item.targetY
        });
        const box = { x: item.boxX, y: item.boxY, w: item.boxWidth, h: item.boxHeight };
        const target = { x: item.targetX, y: item.targetY };
        if (item.isSpecial) {
          item.ref._box = box;
          item.ref._target = target;
        } else {
          item.c._box = box;
          item.c._target = target;
        }
      });
    }

    /* ======================================================
       KÉO THẢ TỰ DO (DRAG & DROP) CHO MỌI Ô NHÃN TRÊN BẢN ĐỒ
       - Kéo vào THÂN Ô: di chuyển cả ô (gốc mũi tên bám theo).
         Cursor hiển thị grab/grabbing ngay khi rê/kéo trên ô.
       - Kéo vào mép PHẢI của ô (vùng rộng RESIZE_HANDLE_WIDTH px,
         hoàn toàn trong suốt - không vẽ gì, không có vạch trang
         trí nào): chỉnh độ rộng ô, cursor chuyển thành ew-resize
         (↔). Mép trái của ô giữ cố định, chỉ mép phải di chuyển
         theo con trỏ chuột; chiều rộng không bao giờ nhỏ hơn độ
         dài thực của văn bản nên không bị cắt chữ, và không bao
         giờ vượt quá rìa phải của canvas (boundary clamp).
       - Kéo vào ĐẦU MŨI TÊN (vòng tròn quanh điểm target): chỉnh
         lại điểm đích mũi tên trỏ vào - toạ độ cũng được giới
         hạn trong đúng khung nhìn canvas.
       - Mọi toạ độ sau khi kéo được lưu trực tiếp vào dữ liệu
         (c.boxOverride/targetOverride/boxWidthOverride, hanoiLabel,
         hcmLabel, companyLabel) nên khi bấm [Cập nhật] / render lại
         sẽ không bị nhảy về trạng thái mặc định ban đầu. drawCallouts()
         luôn tự động boundary-clamp + chống đè (resolveOverlaps) lại
         nên dù dữ liệu override có bị trùng toạ độ, ô vẫn không bao
         giờ văng ra ngoài canvas hay che khuất ô khác.
       ====================================================== */
    function getCanvasPoint(evt) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY
      };
    }

    function pointInBox(pt, box) {
      return box && pt.x >= box.x && pt.x <= box.x + box.w && pt.y >= box.y && pt.y <= box.y + box.h;
    }

    function distance(pt, p2) {
      return Math.hypot(pt.x - p2.x, pt.y - p2.y);
    }

    function allDraggableRefs() {
      const refs = [{ ref: hanoiLabel, kind: "special" }, { ref: hcmLabel, kind: "special" }];
      for (let i = candidates.length - 1; i >= 0; i--) {
        refs.push({ ref: candidates[i], kind: "candidate" });
      }
      return refs;
    }

    function hitTestTarget(pt) {
      for (const { ref } of allDraggableRefs()) {
        if (ref._target && distance(pt, ref._target) <= DRAG_HANDLE_RADIUS) return ref;
      }
      return null;
    }

    // Vùng tay cầm kéo giãn chiều rộng: dải mỏng RESIZE_HANDLE_WIDTH px
    // sát mép phải của ô - hoàn toàn vô hình, chỉ dùng để bắt sự kiện chuột.
    function pointOnResizeHandle(pt, box) {
      if (!box) return false;
      return pt.x >= box.x + box.w - RESIZE_HANDLE_WIDTH && pt.x <= box.x + box.w &&
        pt.y >= box.y && pt.y <= box.y + box.h;
    }

    function hitTestResizeHandle(pt) {
      for (const { ref, kind } of allDraggableRefs()) {
        if (pointOnResizeHandle(pt, ref._box)) return { ref, kind };
      }
      return null;
    }

    function hitTestBox(pt) {
      for (const { ref, kind } of allDraggableRefs()) {
        if (pointInBox(pt, ref._box)) return { ref, kind };
      }
      if (pointInBox(pt, companyLabel._box)) return { ref: companyLabel, kind: "company" };
      return null;
    }

    let dragState = null;

    canvas.addEventListener("mousedown", (e) => {
      const pt = getCanvasPoint(e);

      const targetRef = hitTestTarget(pt);
      if (targetRef) {
        dragState = { mode: "target", ref: targetRef };
        canvas.style.cursor = "grabbing";
        e.preventDefault();
        return;
      }

      const resizeHit = hitTestResizeHandle(pt);
      if (resizeHit) {
        const box = resizeHit.ref._box;
        dragState = {
          mode: "resize",
          ref: resizeHit.ref,
          startX: pt.x,
          startWidth: box.w,
          boxX: box.x
        };
        canvas.style.cursor = "ew-resize";
        e.preventDefault();
        return;
      }

      const boxHit = hitTestBox(pt);
      if (boxHit) {
        const box = boxHit.ref._box;
        dragState = {
          mode: "box",
          kind: boxHit.kind,
          ref: boxHit.ref,
          offsetX: pt.x - box.x,
          offsetY: pt.y - box.y
        };
        canvas.style.cursor = "grabbing";
        e.preventDefault();
      }
    });

    window.addEventListener("mousemove", (e) => {
      const pt = getCanvasPoint(e);

      if (dragState) {
        if (dragState.mode === "target") {
          // Boundary clamp: đầu mũi tên không bao giờ được kéo ra ngoài khung canvas.
          dragState.ref.targetX = clamp(pt.x, 0, canvas.width);
          dragState.ref.targetY = clamp(pt.y, 0, canvas.height);
          dragState.ref.targetOverride = true;
        } else if (dragState.mode === "resize") {
          const deltaX = pt.x - dragState.startX;
          // Boundary clamp: mép phải khi kéo giãn không bao giờ vượt quá rìa canvas.
          const maxWidth = canvas.width - MARGIN_X - dragState.boxX;
          dragState.ref.boxWidthOverride = clamp(dragState.startWidth + deltaX, MIN_BOX_WIDTH, maxWidth);
          dragState.ref.boxX = dragState.boxX;
          dragState.ref.boxOverride = true;
        } else if (dragState.kind === "company") {
          dragState.ref.x = pt.x - dragState.offsetX;
          dragState.ref.y = pt.y - dragState.offsetY;
          dragState.ref.override = true;
        } else {
          dragState.ref.boxX = pt.x - dragState.offsetX;
          dragState.ref.boxY = pt.y - dragState.offsetY;
          dragState.ref.boxOverride = true;
        }
        drawCallouts();
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const insideCanvas = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
      if (!insideCanvas) {
        canvas.style.cursor = "default";
        return;
      }
      if (hitTestTarget(pt)) {
        canvas.style.cursor = "grab";
        return;
      }
      if (hitTestResizeHandle(pt)) {
        canvas.style.cursor = "ew-resize";
        return;
      }
      canvas.style.cursor = hitTestBox(pt) ? "grab" : "default";
    });

    window.addEventListener("mouseup", () => {
      if (dragState) {
        dragState = null;
        canvas.style.cursor = "grab";
      }
    });

    document.getElementById("btnUpdate").addEventListener("click", drawCallouts);

    // Đặt lại vị trí mặc định: xoá toàn bộ cache/override đã kéo tay
    // (vị trí ô, vị trí mũi tên, độ rộng ô đã chỉnh) của mọi ứng viên
    // và 2 nhãn đặc biệt (Hà Nội/TP.HCM), rồi tính lại layout mặc định
    // từ đầu cho TOÀN BỘ danh sách hiện có. Đồng thời dọn sạch mọi dữ
    // liệu từng được lưu ở localStorage (nếu có) để tránh trạng thái cũ.
    document.getElementById("btnResetLayout").addEventListener("click", () => {
      candidates.forEach(c => {
        c.boxOverride = false;
        c.targetOverride = false;
        c.boxWidthOverride = null;
        delete c.boxX;
        delete c.boxY;
        delete c.targetX;
        delete c.targetY;
      });

      hanoiLabel.boxOverride = false;
      hanoiLabel.targetOverride = false;
      hanoiLabel.boxWidthOverride = null;

      hcmLabel.boxOverride = false;
      hcmLabel.targetOverride = false;
      hcmLabel.boxWidthOverride = null;

      companyLabel.override = false;
      companyLabel.x = 0;
      companyLabel.y = 0;

      try { localStorage.clear(); } catch (e) { /* không có quyền truy cập localStorage - bỏ qua */ }

      drawCallouts();
    });

    if (mapImage.complete) {
      drawCallouts();
    } else {
      mapImage.addEventListener("load", drawCallouts);
    }
    window.addEventListener("resize", drawCallouts);

    renderTable();
  </script>
